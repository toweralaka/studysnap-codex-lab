<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StudySnap{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; color: #182b35; background: #f5f7f6; line-height: 1.6; }
        a { color: #14634f; text-underline-offset: .2em; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #af6500; outline-offset: 4px; }
        header { background: white; border-bottom: 1px solid #dce4e0; }
        nav { max-width: 960px; margin: auto; padding: 1.2rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .brand { font-size: 1.35rem; font-weight: 800; text-decoration: none; margin-right: auto; }
        main { max-width: 960px; margin: auto; padding: 3rem 1.2rem; }
        h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.15; margin: .5rem 0 1.25rem; }
        h2 { line-height: 1.3; }
        .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; font-weight: 700; color: #14634f; }
        .intro { max-width: 620px; font-size: 1.15rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.75rem 0 3rem; }
        .button, button { display: inline-block; border: 1px solid #14634f; border-radius: .5rem; padding: .7rem 1.2rem; background: #14634f; color: white; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
        .secondary { background: white; color: #14634f; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 1rem; }
        .card { background: white; border: 1px solid #dce4e0; border-radius: .75rem; padding: 1.5rem; }
        .card h2 { font-size: 1.2rem; margin-top: .5rem; }
        .badge { font-size: .8rem; font-weight: 700; color: #435550; }
        input, textarea { display: block; width: 100%; max-width: 420px; padding: .65rem; border: 1px solid #71817b; border-radius: .35rem; font: inherit; }
        .errorlist { color: #a12323; }
        footer { max-width: 960px; margin: auto; padding: 1.2rem; color: #435550; font-size: .9rem; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <a class="brand" href="{% url 'home' %}">StudySnap</a>
            <a href="{% url 'subjects:list' %}">Subjects</a>
            <a href="{% url 'subjects:create' %}">Create subject</a>
            {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>StudySnap · A little learning, every day.</footer>
</body>
</html>
